[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Explicit adapter: the project was originally detected as a static gallery.
# API routes and SSR need Netlify Functions; .next must not be served as raw files.
[[plugins]]
  package = "@netlify/plugin-nextjs"
